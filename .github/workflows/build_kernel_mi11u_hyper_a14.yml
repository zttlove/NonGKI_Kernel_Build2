name: Build Kernel Xiaomi 11 Ultra (HyperOS A14) with KSU + SUSFS
on:
  workflow_call:
  workflow_dispatch:

env:
  PROFILE_NAME: "star_hyper_a14.env"
  CCACHE_DIR: "/tmp/ccache"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 读取配置
      - name: Load Config
        run: |
          source Profiles/${{ env.PROFILE_NAME }}
          cat >> $GITHUB_ENV << EOF
          KERNEL_SOURCE=$KERNEL_SOURCE
          KERNEL_BRANCH=$KERNEL_BRANCH
          CLANG_SOURCE=$CLANG_SOURCE
          CLANG_BRANCH=$CLANG_BRANCH
          DEFCONFIG_NAME=$DEFCONFIG_NAME
          KERNELSU_SOURCE=$KERNELSU_SOURCE
          KERNELSU_BRANCH=$KERNELSU_BRANCH
          KERNELSU_NAME=$KERNELSU_NAME
          AK3_SOURCE=$AK3_SOURCE
          AK3_BRANCH=$AK3_BRANCH
          SUSFS_ENABLE=$SUSFS_ENABLE
          EOF
          mv Patches /tmp/

      # 清理空间
      - name: Free Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 安装依赖（不含错误包、不含多余东西）
      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make bc bison flex gcc g++ zip unzip curl wget p7zip-full ccache \
          libssl-dev libelf-dev libz-dev device-tree-compiler lld llvm clang

      # 克隆 CLANG
      - name: Clone Clang
        run: |
          git clone --depth=1 ${{ env.CLANG_SOURCE }} -b ${{ env.CLANG_BRANCH }} clang
          echo "PATH=$PWD/clang/bin:$PATH" >> $GITHUB_ENV

      # 克隆内核源码
      - name: Clone Kernel
        run: |
          git clone --depth=1 --recursive ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_BRANCH }} kernel
          cd kernel
          echo "KERNEL_VERSION=$(make kernelversion | head -n1)" >> $GITHUB_ENV

      # 克隆 KernelSU
      - name: Integrate KernelSU
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          git clone --depth=1 ${{ env.KERNELSU_SOURCE }} -b ${{ env.KERNELSU_BRANCH }} ${{ env.KERNELSU_NAME }}
          ln -s ../${{ env.KERNELSU_NAME }}/kernel drivers/kernelsu

      # 启用 KernelSU 配置
      - name: Enable KSU
        run: |
          cd kernel
          sed -i '/^CONFIG_LOCALVERSION=/a CONFIG_KSU=y' arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

      # 克隆并植入 SUSFS
      - name: Integrate SUSFS
        if: env.SUSFS_ENABLE == 'true'
        run: |
          cd kernel
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-${{ env.KERNEL_VERSION }} susfs
          cp -rf susfs/kernel_patches/fs/* fs/
          cp -rf susfs/kernel_patches/include/linux/* include/linux/

      # 打补丁
      - name: Apply Patches
        run: |
          cd kernel
          bash /tmp/Patches/normal_patches.sh
          bash /tmp/Patches/backport_patches.sh || true

      # 编译内核（修复 ld.lld 错误！）
      - name: Build Kernel
        run: |
          cd kernel
          mkdir -p out
          make O=out ARCH=arm64 ${{ env.DEFCONFIG_NAME }}
          make -j$(nproc) O=out ARCH=arm64 \
            CC="clang" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            LD="ld.lld" \
            STRIP="llvm-strip"

      # 打包 Anykernel3
      - name: Pack with Anykernel3
        run: |
          git clone --depth=1 ${{ env.AK3_SOURCE }} -b ${{ env.AK3_BRANCH }} ak3
          cp kernel/out/arch/arm64/boot/Image.gz ak3/
          cd ak3
          zip -r9 "Kernel_Star_KSU_SUSFS.zip" ./*
          mv *.zip ../

      # 上传成品
      - uses: actions/upload-artifact@v4
        with:
          name: Kernel_Final
          path: "*.zip"
