name: Build Xiaomi 11 Ultra (star) Kernel - KSU + SUSFS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Clean system space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make bc bison flex build-essential curl wget zip unzip p7zip-full ccache lld llvm clang libssl-dev libelf-dev

      - name: Clone Clang toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r498929.git -b lineage-20.0 clang
          echo "PATH=$PWD/clang/bin:$PATH" >> $GITHUB_ENV

      - name: Clone kernel source
        run: |
          git clone --depth=1 --recursive https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b star-s-12.1 kernel

      - name: Integrate KernelSU
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu

      - name: Enable KernelSU config
        run: |
          cd kernel
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/star_defconfig

      - name: Apply kernel patches
        run: |
          cd kernel
          bash ../Patches/normal_patches.sh || true
          bash ../Patches/backport_patches.sh || true

      - name: Build kernel
        run: |
          cd kernel
          mkdir -p out
          make O=out ARCH=arm64 vendor/star_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Make Anykernel3 package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b master ak3
          cp kernel/out/arch/arm64/boot/Image.gz ak3/
          cd ak3
          zip -r9 Kernel_11Ultra_KSU.zip *

      - name: Upload final kernel
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi_11Ultra_KSU_SUSFS
          path: ak3/*.zip
